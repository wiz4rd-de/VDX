# VDX CI (SPEC §15.1). Runs once per phase (owner rule): the full suite on pull
# requests into main (pushes to an open PR re-run it — batch fixes), plus a
# manual re-run. Never on pushes to development branches. The post-merge smoke
# test lives in smoke.yml.
name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  EMSDK_VERSION: 6.0.13
  NODE_VERSION: 26
  PLUGINVAL_VERSION: v1.0.4

jobs:
  licence:
    name: Licence and branding checks (R-L3, R-L4, R-L5)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/licence_check.py --self-test
      - run: python3 tools/licence_check.py --branding

  desktop:
    name: Desktop ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (universal)
            os: macos-15
            configure: >-
              -G Ninja -DCMAKE_BUILD_TYPE=Release
              -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0
          - name: Windows (MSVC)
            os: windows-2022
            configure: -G "Visual Studio 17 2022" -A x64
          - name: Ubuntu 24.04
            os: ubuntu-24.04
            configure: -G Ninja -DCMAKE_BUILD_TYPE=Release
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libwebkit2gtk-4.1-dev libgtk-3-dev libasound2-dev \
            libcurl4-openssl-dev libfreetype-dev libfontconfig1-dev libx11-dev libxcomposite-dev \
            libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev xvfb
      - name: macOS dependencies
        if: runner.os == 'macOS'
        run: brew install ninja
      - name: WebView2 SDK
        if: runner.os == 'Windows'
        shell: pwsh
        run: nuget install Microsoft.Web.WebView2 -Version 1.0.2903.40 -OutputDirectory "$env:USERPROFILE\AppData\Local\PackageManagement\NuGet\Packages"
      - name: Download pluginval (GPL tool, never in the repository)
        shell: bash
        run: |
          case "${{ runner.os }}" in
            macOS)   asset=pluginval_macOS.zip;   exe=pluginval.app/Contents/MacOS/pluginval ;;
            Windows) asset=pluginval_Windows.zip; exe=pluginval.exe ;;
            Linux)   asset=pluginval_Linux.zip;   exe=pluginval ;;
          esac
          curl -sSL -o pv.zip "https://github.com/Tracktion/pluginval/releases/download/${PLUGINVAL_VERSION}/${asset}"
          mkdir -p "$RUNNER_TEMP/pv" && (cd "$RUNNER_TEMP/pv" && unzip -q "$GITHUB_WORKSPACE/pv.zip")
          echo "PLUGINVAL=$RUNNER_TEMP/pv/$exe" >> "$GITHUB_ENV"
      - name: Configure
        shell: bash
        run: cmake -S . -B build ${{ matrix.configure }} -DVDX_BUILD_PLUGIN=ON -DVDX_BUILD_TESTS=ON -DVDX_PLUGINVAL="$PLUGINVAL"
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Register the AU (macOS)
        if: runner.os == 'macOS'
        run: killall -9 AudioComponentRegistrar || true
      - name: Tests — core, plugin, pluginval strictness 5 (AC-PL1), licence
        if: runner.os != 'Linux'
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Tests — core, plugin, pluginval strictness 5 (AC-PL1), licence (xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a ctest --test-dir build -C Release --output-on-failure
      - name: Sign and notarise (macOS, only when secrets exist)
        if: runner.os == 'macOS' && env.MACOS_CERTIFICATE != ''
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
        run: tools/sign/macos.sh build
      - name: Sign (Windows, only when secrets exist)
        if: runner.os == 'Windows' && env.WINDOWS_CERTIFICATE != ''
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: tools/sign/windows.ps1 build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vdx-${{ runner.os }}
          path: |
            build/plugin/VDX_artefacts/**/Standalone
            build/plugin/VDX_artefacts/**/VST3
            build/plugin/VDX_artefacts/**/AU
          if-no-files-found: ignore

  wasm:
    name: WebAssembly (core tests under Node, benchmark)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Emscripten
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$HOME/emsdk"
          "$HOME/emsdk/emsdk" install "$EMSDK_VERSION"
          "$HOME/emsdk/emsdk" activate "$EMSDK_VERSION"
      - name: Build and test the core under Node (same Catch2 binary as native)
        run: |
          source "$HOME/emsdk/emsdk_env.sh"
          sudo apt-get install -y ninja-build
          emcmake cmake -S . -B build-wasm -G Ninja -DCMAKE_BUILD_TYPE=Release -DVDX_BUILD_TESTS=ON
          cmake --build build-wasm --parallel
          ctest --test-dir build-wasm --output-on-failure
      - name: WASM benchmark (AC-N1.1, < 25 % of real time)
        run: node build-wasm/tools/bench/vdx_bench.js --limit 25

  web:
    name: Web UI (Vitest, Playwright Chromium + WebKit)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Emscripten
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$HOME/emsdk"
          "$HOME/emsdk/emsdk" install "$EMSDK_VERSION"
          "$HOME/emsdk/emsdk" activate "$EMSDK_VERSION"
      - name: Build the web module
        run: |
          source "$HOME/emsdk/emsdk_env.sh"
          web/build.sh
      - name: UI unit tests, contrast and raster checks
        working-directory: ui
        run: |
          npm ci
          npm run check
          npm test
          npm run contrast
          npm run build
          npm run raster-check
      - name: Playwright
        working-directory: ui
        run: |
          npx playwright install --with-deps chromium webkit
          npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: ui/playwright-report
