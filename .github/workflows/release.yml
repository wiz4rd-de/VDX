# Release (D-PL17): builds the packages from main and attaches them to a draft
# GitHub Release, which you publish by hand after checking it.
# Started by hand only (owner CI rule): the full suite already ran on the PR
# into main, so this builds, packages and smoke-tests the packaged plugins
# with pluginval, and runs nothing else. Signing runs only when its secrets
# exist; without them the packages are unsigned (D-PL17).
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version (X.Y.Z; must equal project(VDX VERSION) and the plugin VERSION)
        required: true
      prerelease:
        description: Mark as a pre-release
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  NODE_VERSION: 26
  PLUGINVAL_VERSION: v1.0.4
  VERSION: ${{ inputs.version }}

jobs:
  check:
    name: Branch, version and tag
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$GITHUB_REF" == refs/heads/main ]] || { echo "::error::Release from main only (got $GITHUB_REF)"; exit 1; }
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Version must be X.Y.Z (got $VERSION)"; exit 1; }
          root=$(sed -nE 's/^project\(VDX VERSION ([0-9.]+).*/\1/p' CMakeLists.txt)
          plugin=$(sed -nE 's/^ +VERSION +([0-9.]+)$/\1/p' plugin/CMakeLists.txt)
          if [[ "$root" != "$VERSION" || "$plugin" != "$VERSION" ]]; then
            echo "::error::$VERSION does not match CMakeLists.txt ($root) and plugin/CMakeLists.txt ($plugin)"; exit 1
          fi
          if gh release view "v$VERSION" >/dev/null 2>&1 || git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::v$VERSION already exists"; exit 1
          fi

  package:
    name: Package ${{ matrix.name }}
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (universal)
            os: macos-15
            configure: >-
              -G Ninja -DCMAKE_BUILD_TYPE=Release
              -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0
          - name: Windows x64
            os: windows-2022
            configure: -G "Visual Studio 17 2022" -A x64
          - name: Linux x64
            os: ubuntu-24.04
            configure: -G Ninja -DCMAKE_BUILD_TYPE=Release
    runs-on: ${{ matrix.os }}
    env:
      ART: build/plugin/VDX_artefacts/Release
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libwebkit2gtk-4.1-dev libgtk-3-dev libasound2-dev \
            libcurl4-openssl-dev libfreetype-dev libfontconfig1-dev libx11-dev libxcomposite-dev \
            libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev xvfb
      - name: macOS dependencies
        if: runner.os == 'macOS'
        run: brew install ninja
      - name: WebView2 SDK and Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          nuget install Microsoft.Web.WebView2 -Version 1.0.2903.40 -OutputDirectory "$env:USERPROFILE\AppData\Local\PackageManagement\NuGet\Packages"
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Download pluginval (GPL tool, never in the repository or the packages)
        shell: bash
        run: |
          case "${{ runner.os }}" in
            macOS)   asset=pluginval_macOS.zip;   exe=pluginval.app/Contents/MacOS/pluginval ;;
            Windows) asset=pluginval_Windows.zip; exe=pluginval.exe ;;
            Linux)   asset=pluginval_Linux.zip;   exe=pluginval ;;
          esac
          curl -sSL -o pv.zip "https://github.com/Tracktion/pluginval/releases/download/${PLUGINVAL_VERSION}/${asset}"
          mkdir -p "$RUNNER_TEMP/pv" && (cd "$RUNNER_TEMP/pv" && unzip -q "$GITHUB_WORKSPACE/pv.zip")
          echo "PLUGINVAL=$RUNNER_TEMP/pv/$exe" >> "$GITHUB_ENV"
      - name: Configure
        shell: bash
        run: cmake -S . -B build ${{ matrix.configure }} -DVDX_BUILD_PLUGIN=ON -DVDX_BUILD_TESTS=OFF
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Universal binary (macOS)
        if: runner.os == 'macOS'
        run: |
          archs=$(lipo -archs "$ART/Standalone/VDX.app/Contents/MacOS/VDX")
          [[ " $archs " == *" arm64 "* && " $archs " == *" x86_64 "* ]] || { echo "::error::not universal: $archs"; exit 1; }
      - name: Licence notices into the bundles
        shell: bash
        run: |
          py=$(command -v python3 || command -v python)
          extra=()
          if [[ "$RUNNER_OS" == Windows ]]; then
            lic=$(find "$(cygpath "$USERPROFILE")/AppData/Local/PackageManagement/NuGet/Packages/Microsoft.Web.WebView2.1.0.2903.40" -maxdepth 1 -iname 'LICENSE*' | head -1)
            [[ -n "$lic" ]] || { echo "::error::WebView2 SDK licence file not found"; exit 1; }
            extra=(--webview2-license "$(cygpath -w "$lic")")
          fi
          "$py" tools/package/notices.py --install "$ART" ${extra[@]+"${extra[@]}"}
      # A step's `if` cannot see its own env, and secrets are not allowed in `if`,
      # so one step reports which signing secrets exist.
      - name: Signing secrets present?
        id: signing
        shell: bash
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
        run: |
          echo "macos=${MACOS_CERTIFICATE:+yes}" >> "$GITHUB_OUTPUT"
          echo "windows=${WINDOWS_CERTIFICATE:+yes}" >> "$GITHUB_OUTPUT"
      - name: Sign and notarise (macOS, only when secrets exist)
        if: runner.os == 'macOS' && steps.signing.outputs.macos == 'yes'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
        run: tools/sign/macos.sh build
      - name: Sign (Windows, only when secrets exist)
        if: runner.os == 'Windows' && steps.signing.outputs.windows == 'yes'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: tools/sign/windows.ps1 build
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: tools/package/macos.sh "$ART" "$VERSION" dist
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: tools/package/windows.ps1 -Artefacts $env:ART -Version $env:VERSION -Out dist
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tools/package/linux.sh "$ART" "$VERSION" dist
      - name: Smoke test — pluginval strictness 5 on the packaged VST3 (macOS)
        if: runner.os == 'macOS'
        run: '"$PLUGINVAL" --strictness-level 5 --validate-in-process --validate "$ART/VST3/VDX.vst3"'
      - name: Smoke test — pluginval strictness 5 on the packaged VST3 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: '& $env:PLUGINVAL --strictness-level 5 --validate-in-process --validate "$env:ART/VST3/VDX.vst3"'
      - name: Smoke test — pluginval strictness 5 on the packaged VST3 (xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a "$PLUGINVAL" --strictness-level 5 --validate-in-process --validate "$ART/VST3/VDX.vst3"
      - name: Smoke test — pluginval strictness 5 on the packaged AU (macOS)
        if: runner.os == 'macOS'
        run: |
          au="$HOME/Library/Audio/Plug-Ins/Components/VDX.component"
          rm -rf "$au" && ditto "$ART/AU/VDX.component" "$au"
          killall -9 AudioComponentRegistrar || true
          "$PLUGINVAL" --strictness-level 5 --validate-in-process --validate "$au"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ runner.os }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Draft GitHub Release
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Checksums
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS && cat SHA256SUMS
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          cat > notes.md <<EOF
          VDX $VERSION: standalone app and plugins for macOS 13+ (universal: Standalone, VST3, AU), Windows 10 22H2+/11 x64 (Standalone, VST3) and Ubuntu 24.04 x64 (Standalone, VST3).

          | File | Contents |
          | --- | --- |
          | \`VDX-$VERSION-macOS.pkg\` | Installer: app, VST3, AU |
          | \`VDX-$VERSION-Windows-x64-Setup.exe\` | Installer: app, VST3 |
          | \`VDX-$VERSION-Windows-x64.zip\` | The same files, to copy by hand |
          | \`VDX-$VERSION-Linux-x64.tar.gz\` | App and VST3, with INSTALL.txt |
          | \`SHA256SUMS\` | Checksums |

          **These builds are not code-signed.** macOS blocks the installer the first time and Windows SmartScreen warns; [Install a release](https://github.com/${GITHUB_REPOSITORY}/blob/main/README.md#install-a-release) has the steps.
          EOF
          flags=(--draft --target "$GITHUB_SHA" --title "VDX $VERSION" --notes-file notes.md)
          [[ "$PRERELEASE" == true ]] && flags+=(--prerelease)
          gh release create "v$VERSION" dist/* "${flags[@]}" --repo "$GITHUB_REPOSITORY"
